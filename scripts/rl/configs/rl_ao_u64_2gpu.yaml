# u64 warm start: k4.L20-60.cont.u64.s0/step28000 (continuation_raw prompts,
# <activation> tags, raw-span target, layers 20-60, alpha 16000 transform).
# 2 GPUs per run (actor + frozen AR), 512 completions/step.

base_ckpt: Qwen/Qwen3.6-27B
ao_lora: artifacts/sc/hf/ckpts/ao/chat/k4.L20-60.cont.u64.s0/step28000/lora_hf
ar_ckpt: artifacts/sc/hf/ckpts/ar/chat/mlayer.lc.s0/ex16014240
whitener_dir: artifacts/sc/whiteners/chat
whitener_prefix: whitening_iolens_chat
ridge: 0.1
rl_parquet: artifacts/sc/rl_u64/rl_train_0.parquet
eval_parquet: artifacts/sc/rl_u64/rl_gate_0.parquet
diag_parquet: artifacts/sc/rl_u64/rl_diag.parquet   # build_diag_bank.py (acetaminophen/GFP/...)
sidecar: artifacts/sc/rl_u64/merged/nla_meta.yaml

num_steps: 50
batch_prompts: 8
group_size: 64          # 8 x 64 = 512 completions/step
gen_prompts_per_call: 4   # 4x64=256-row generate calls (throughput; token-identical)
max_new_tokens: 128
temperature: 1.0
lr: 5e-5                # overridden per sweep arm
kl_beta: 0.05
length_penalty: 0.0
logp_micro_batch: 4     # 8 OOM'd at mnt=128 (graph + ref-forward peak on 141 GB)
rm_micro_batch: 32
eval_every: 5
eval_n_prompts: 128
eval_gen_batch: 32
save_every: 25
seed: 0

wandb_project: ola
wandb_group: rl-sc-u64
